title: SDLC³- SDLC Common Controls Catalog

version: pre-alpha
release-date: 2025-09-23
baseurl: ""

# Canonical public address, used for citation links. Kept separate from `url`
# because `jekyll serve` overrides `url` with the local server address.
public_url: "https://sdlc-common-controls.finos.org"

risk_classification:
  OP: Operational
  SEC: Security
  RC: Regulatory and Compliance
  BUS: Business

mitigation_classification:
  PREV: Preventative
  DET: Detective

# SDLC phase at which a mitigation primarily operates. LIFECYCLE is the
# cross-cutting bucket for governance/process controls that are not tied to a
# single phase. META marks "meta controls" — controls whose subject is the
# operation of other controls rather than a specific SDLC phase (see the
# glossary). Used by the catalog phase filter.
phase_classification:
  CODE: Code
  BUILD: Build
  RELEASE: Release
  RUNTIME: Runtime
  LIFECYCLE: Lifecycle
  META: Meta

# Bootstrap Icons class for each classification code, used by the catalog
# headings and filter checkboxes. Adding a new code above requires adding the
# matching icon here.
category_icons:
  OP: bi-person-fill-gear
  SEC: bi-bug-fill
  RC: bi-clipboard2-check-fill
  BUS: bi-briefcase-fill
  PREV: bi-lock-fill
  DET: bi-eye-fill
  CODE: bi-code-slash
  BUILD: bi-hammer
  RELEASE: bi-rocket-takeoff-fill
  RUNTIME: bi-play-circle-fill
  LIFECYCLE: bi-arrow-repeat
  META: bi-layers-fill

document_status:
  - name: Pre-Draft
    description: "Agreed as needed, but nobody has started writing it yet."
  - name: Draft
    description: "Written and open as a pull request for working-group review. Not yet merged, so it does not appear on the site."
  - name: First-Reading-Approved
    description: "Reviewed by the working group and merged. Substantially complete, but may still change before final approval."
  - name: Working-Group-Approved
    description: "In its final form and approved by the working group, at version 1.0 or later."

# FFIEC IT Booklet abbreviations mapping
ffiec_itbooklet_abbreviations:
  architecture-infrastructure-and-operations: aio
  archived-booklets: arc
  audit: aud
  business-continuity-management: bcm
  development-acquisition-and-maintenance: dam
  information-security: sec
  management: mgt
  outsourcing-technology-services: ots
  retail-payment-systems: rps
  supervision-of-technology-service-providers: tsp
  wholesale-payment-systems: wps

collections:
  risks:
    output: true
  mitigations:
    output: true
  # Immutable per-card version snapshots, generated by scripts/version-snapshot.
  # Each document is a frozen copy of a mitigation or risk at a sliced version.
  versions:
    output: true
